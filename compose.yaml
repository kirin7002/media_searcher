services:
  media-searcher:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3210
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3210}:3210"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
